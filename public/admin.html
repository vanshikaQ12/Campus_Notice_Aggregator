
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Campus Notice Aggregator</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header class="navbar">
        <h2>CAMPUS CONNECT</h2>

        <nav>
            <span class="admin-label">ADMIN PANEL</span>
            <button id="logoutBtn">Logout</button>
        </nav>
    </header>

    <main class="container">

        <section class="welcome-section">
            <p class="tagline">CAMPUS MANAGEMENT</p>
            <h1 id="welcomeMessage">Welcome, Admin!</h1>
            <p>Create and manage campus announcements from one place.</p>
        </section>

        <section class="admin-content">

            <div class="section-heading">
                <h2>Publish a Notice</h2>
                <p>Share important updates with students.</p>
            </div>

            <form id="noticeForm">

                <label for="title">Notice Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter notice title"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Write the notice details..."
                    rows="5"
                    required
                ></textarea>

                <div class="form-row">

                    <div>
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Academic">Academic</option>
                            <option value="Events">Events</option>
                            <option value="Placement">Placement</option>
                            <option value="Sports">Sports</option>
                            <option value="Administrative">Administrative</option>
                            <option value="Examinations">Examinations</option>
                            <option value="Holidays">Holidays</option>
                        </select>
                    </div>

                    <div>
                        <label for="semester">Semester</label>
                        <select id="semester" required>
                            <option value="">Select Semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>

                </div>

                <label for="expiryDate">Expiry Date (Optional)</label>
                <input type="date" id="expiryDate">

                <label class="pin-option">
                    <input type="checkbox" id="isPinned">
                    Pin this notice
                </label>

                <button type="submit">Publish Notice →</button>

                <p id="message"></p>

            </form>

        </section>

        <section class="published-section">
            <div class="section-heading">
                <h2>Published Notices</h2>
                <p>Manage your campus announcements.</p>
            </div>

            <div id="noticeList" class="notice-grid">
                <p>Loading notices...</p>
            </div>
        </section>

    </main>

    <script src="js/admin.js"></script>

</body>
</html>
